#
# Release flow: bump VERSION and gradle.properties together, merge to main.
# This workflow builds the plugin zip and attaches it to a GitHub Release when
# the version file on main is newer than the latest tag.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the tag check below can see existing tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # VERSION at the repo root is the single source of truth for the version;
      # gradle.properties has to agree with it.
      - name: Read version from VERSION and cross-check gradle.properties
        id: version
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$FILE_VERSION' is not X.Y.Z — refusing to release"
            exit 1
          fi
          GRADLE_LINE=$(grep -E '^version[[:space:]]*=' gradle.properties || true)
          if [ -z "$GRADLE_LINE" ]; then
            echo "::error::gradle.properties has no 'version =' line — cannot cross-check VERSION"
            exit 1
          fi
          GRADLE_VERSION=$(printf '%s' "$GRADLE_LINE" | sed -E 's/^version[[:space:]]*=//' | tr -d '[:space:]')
          if [ "$FILE_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) does not match gradle.properties version ($GRADLE_VERSION) — sync them before releasing"
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      # This only runs on push to main, so GITHUB_SHA is already the tip of main — there is
      # no need to check that the commit is an ancestor of main, and --target below tags
      # exactly this SHA.
      - name: Compare version against latest release tag
        id: release_gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          LATEST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No prior release tag — v${VERSION} will be the first release"
            exit 0
          fi
          LATEST_VERSION="${LATEST#v}"
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "::error::v${VERSION} was already released — bump VERSION before merging"
            exit 1
          fi
          TAG_FOR_VERSION="v${VERSION}"
          LOWEST=$(printf '%s\n%s\n' "$TAG_FOR_VERSION" "$LATEST" | sort -V | head -1)
          if [ "$LOWEST" = "$TAG_FOR_VERSION" ]; then
            echo "::error::VERSION ${VERSION} is older than the latest release ${LATEST} — check for an accidental revert"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is newer than ${LATEST} — proceeding with release"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Gate the release on the same layout check PRs run, so a release can never ship a broken layout.
      - name: Validate plugin layout
        run: node scripts/validate-jetbrains-plugin.mjs

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon

      # buildPlugin names the zip after the plugin and its version, so find it rather than
      # hardcoding the name — then make sure it is the version we are about to release and
      # not a stale artifact from an earlier build.
      - name: Locate the built plugin zip
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP=$(find build/distributions -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No plugin zip found under build/distributions"
            exit 1
          fi
          ZIP_NAME=$(basename "$ZIP")
          case "$ZIP_NAME" in
            *"$VERSION"*) ;;
            *)
              echo "::error::Built zip '$ZIP_NAME' does not carry version $VERSION — refusing to release a mismatched artifact"
              exit 1
              ;;
          esac
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # --target creates the tag as part of the release, so a failure can't leave an orphan tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.artifact.outputs.zip }}
        run: |
          gh release create "v${VERSION}" \
            "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes

      # If anything after the gate fails, a half-created release (and its tag) would block
      # a retry of the same version, so remove it and let the next push start clean.
      - name: Clean up a partial release
        if: failure() && steps.release_gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release delete "v${VERSION}" --yes --cleanup-tag || true
