#
# Release flow: bump VERSION and gradle.properties together, merge to main.
# This workflow builds the plugin zip and attaches it to a GitHub Release when
# the version file on main is newer than the latest tag.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the tag check below can see existing tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # VERSION at the repo root is the single source of truth for the version;
      # gradle.properties has to agree with it.
      - name: Read version from VERSION and cross-check gradle.properties
        id: version
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$FILE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION '$FILE_VERSION' is not X.Y.Z — refusing to release"
            exit 1
          fi
          GRADLE_VERSION=$(grep -E '^version[[:space:]]*=' gradle.properties | sed -E 's/^version[[:space:]]*=[[:space:]]*//')
          if [ "$FILE_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) does not match gradle.properties version ($GRADLE_VERSION) — sync them before releasing"
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare version against latest release tag
        id: release_gate
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git fetch --tags origin
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No prior release tag — v${VERSION} will be the first release"
            exit 0
          fi
          LATEST_VERSION="${LATEST#v}"
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "::error::v${VERSION} was already released — bump VERSION before merging"
            exit 1
          fi
          TAG_FOR_VERSION="v${VERSION}"
          LOWEST=$(printf '%s\n%s\n' "$TAG_FOR_VERSION" "$LATEST" | sort -V | head -1)
          if [ "$LOWEST" = "$TAG_FOR_VERSION" ]; then
            echo "::error::VERSION ${VERSION} is older than the latest release ${LATEST} — check for an accidental revert"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is newer than ${LATEST} — proceeding with release"

      - name: Set up Node.js
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Gate the release on the same layout check PRs run, so a release can never ship a broken layout.
      - name: Validate plugin layout
        if: steps.release_gate.outputs.should_release == 'true'
        run: node scripts/validate-jetbrains-plugin.mjs

      - name: Set up JDK
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build plugin
        if: steps.release_gate.outputs.should_release == 'true'
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        if: steps.release_gate.outputs.should_release == 'true'
        run: ./gradlew verifyPlugin --no-daemon

      # buildPlugin names the zip after the plugin and its version, so find it rather than
      # hardcoding the name.
      - name: Locate the built plugin zip
        if: steps.release_gate.outputs.should_release == 'true'
        id: artifact
        run: |
          set -euo pipefail
          ZIP=$(find build/distributions -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No plugin zip found under build/distributions"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # --target creates the tag as part of the release, so a failure can't leave an orphan tag.
      - name: Create GitHub release
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "${{ steps.artifact.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
