#
# Manually publishes the plugin to JetBrains Marketplace via `./gradlew publishPlugin`.
# Requires secrets PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD;
# the first version must be uploaded manually via the Marketplace web UI beforehand.
#
# Must be dispatched from a release tag (v*): the signing secrets are exposed to
# the checked-out code, so we don't allow an arbitrary ref/branch to run with them.
name: Publish to JetBrains Marketplace

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Enforce release-tag ref
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::Publish must be run from a release tag (v*). Got '${GITHUB_REF}'."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail early if the publish token is missing
        run: |
          if [ -z "${PUBLISH_TOKEN}" ]; then
            echo "::error::PUBLISH_TOKEN secret is not set. Add it (and the signing secrets) in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # signPlugin runs automatically before publishPlugin when the signing
      # secrets are present; publishPlugin uploads the signed zip.
      - name: Publish plugin
        run: ./gradlew publishPlugin --no-daemon
