name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # VERSION at the repo root is the release source of truth (see .github/workflows/release.yml).
      # Catch drift here so a PR cannot merge with the two files disagreeing.
      - name: Check VERSION matches gradle.properties
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$FILE_VERSION' is not X.Y.Z"
            exit 1
          fi
          GRADLE_LINE=$(grep -E '^version[[:space:]]*=' gradle.properties || true)
          if [ -z "$GRADLE_LINE" ]; then
            echo "::error::gradle.properties has no 'version =' line — cannot cross-check VERSION"
            exit 1
          fi
          GRADLE_VERSION=$(printf '%s' "$GRADLE_LINE" | sed -E 's/^version[[:space:]]*=//' | tr -d '[:space:]')
          if [ "$FILE_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) does not match gradle.properties version ($GRADLE_VERSION) — sync them"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate plugin layout
        run: node scripts/validate-jetbrains-plugin.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon
